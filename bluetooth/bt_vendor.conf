# Bluetooth vendor configuration for SpacemiT K3 Pico-ITX
# RTL8852B Bluetooth over USB (btusb + btrtl, mainline).
#
# Unlike the K1 (UART transport: rtk_hciattach binds /dev/ttyS1), the K3
# controller is a standard USB HCI. btusb enumerates it and registers a kernel
# hci interface; the AOSP default Bluetooth HAL (libbt-hci over the kernel HCI
# socket) drives it directly. There is therefore NO UART vendor transport and
# no UartPort/UartBaudRate/UseFlowControl keys here — those only apply to the
# Realtek UART HCI path. btrtl loads the controller firmware itself from
# /vendor/firmware/rtl_bt/ (rtl8852bu_fw.bin + rtl8852bu_config.bin), so no
# userspace firmware push is needed either.
#
# This file is kept only so BOARD_BLUETOOTH_BDROID_BUILDCFG_INCLUDE_DIR points
# at a populated directory; it intentionally carries no transport settings.
